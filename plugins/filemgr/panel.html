<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件暂存</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:transparent; overflow:hidden;
    font:500 12px/1.3 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    color:var(--dock-text,#e8eaf0); -webkit-user-select:none; user-select:none; }
  /* 单一定形容器：铺满窗口。窗口尺寸由宿主补间；这里跟着铺满并连续改圆角，
     所以小球会平滑“长”成长条，而不是“大透明框里一个小球”。 */
  #pill{ width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:rgba(18,20,26,.94); border:1px solid rgba(255,255,255,.10);
    overflow:hidden; position:relative; }
  #balln{ display:none; font-weight:700; font-size:13px; }
  body.ball #balln{ display:block; }
  body.ball #bar{ display:none; }
  #bar{ width:100%; height:100%; display:flex; flex-direction:column; gap:4px; padding:6px 8px; }
  #head{ display:flex; align-items:center; gap:4px; }
  #title{ flex:1 1 auto; opacity:.7; font-size:11px; }
  .btn{ appearance:none; border:0; background:rgba(255,255,255,.10); color:#dfe3ea; width:20px; height:20px;
    border-radius:6px; font-size:15px; line-height:1; cursor:pointer; padding:0; }
  .btn:hover{ background:rgba(255,255,255,.20); }
  #chips{ display:flex; flex-wrap:wrap; gap:6px; overflow-y:auto; overflow-x:hidden; align-content:flex-start;
    flex:1 1 auto; min-height:0; scrollbar-width:thin; }
  #chips::-webkit-scrollbar{ width:6px; } #chips::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:3px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 6px 0 10px; border-radius:9px;
    background:rgba(255,255,255,.07); max-width:100%; }
  .chip.missing{ opacity:.5; }
  .chip .ic{ flex:0 0 auto; width:14px; text-align:center; }
  .chip .nm{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .x{ appearance:none; border:0; background:transparent; color:#9aa0ab; width:16px; height:16px;
    font-size:13px; line-height:1; cursor:pointer; padding:0; border-radius:5px; }
  .chip .x:hover{ background:rgba(255,90,90,.25); color:#ffd0d0; }
  #empty{ opacity:.5; font-size:11px; padding:2px; }
  body.dragover #pill{ outline:2px dashed rgba(120,170,255,.8); outline-offset:-4px; }
</style>
</head>
<body>
<div id="pill">
  <span id="balln"></span>
  <div id="bar">
    <div id="head"><span id="title">文件暂存</span><button class="btn" id="more" title="打开管理">＋</button><button class="btn" id="clear" title="移除全部">×</button><button class="btn" id="close" title="收起">–</button></div>
    <div id="chips"></div>
    <div id="empty">拖文件到主岛即可暂存</div>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
