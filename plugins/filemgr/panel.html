<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件暂存</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:transparent; overflow:hidden;
    font:500 12px/1.3 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    color:var(--dock-text,#e8eaf0); -webkit-user-select:none; user-select:none; }
  #root{ width:100%; height:100%; position:relative; display:flex; align-items:center; }
  #ball{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(18,20,26,.94); border:1px solid rgba(255,255,255,.10); border-radius:50%; }
  #ball .n{ font-weight:700; font-size:13px; }
  body.ball #ball{ display:flex; } body.ball #bar{ display:none; }
  #bar{ width:100%; height:100%; display:flex; flex-direction:column; gap:4px; padding:6px 8px;
    background:rgba(18,20,26,.94); border:1px solid rgba(255,255,255,.10); border-radius:12px; overflow:hidden; }
  #head{ display:flex; align-items:center; gap:4px; }
  #title{ flex:1 1 auto; opacity:.7; font-size:11px; }
  .btn{ appearance:none; border:0; background:rgba(255,255,255,.10); color:#dfe3ea; width:20px; height:20px;
    border-radius:6px; font-size:15px; line-height:1; cursor:pointer; padding:0; }
  .btn:hover{ background:rgba(255,255,255,.20); }
  #chips{ display:flex; flex-wrap:wrap; gap:6px; overflow:hidden; align-content:flex-start; }
  .chip{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 6px 0 10px; border-radius:9px;
    background:rgba(255,255,255,.07); max-width:100%; }
  .chip.missing{ opacity:.5; }
  .chip .ic{ flex:0 0 auto; width:14px; text-align:center; }
  .chip .nm{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .x{ appearance:none; border:0; background:transparent; color:#9aa0ab; width:16px; height:16px;
    font-size:13px; line-height:1; cursor:pointer; padding:0; border-radius:5px; }
  .chip .x:hover{ background:rgba(255,90,90,.25); color:#ffd0d0; }
  #empty{ opacity:.5; font-size:11px; padding:2px; }
  body.dragover #bar{ outline:2px dashed rgba(120,170,255,.8); outline-offset:-4px; }
</style>
</head>
<body>
<div id="root">
  <div id="ball" title="文件暂存"><span class="n" id="balln"></span></div>
  <div id="bar">
    <div id="head"><span id="title">文件暂存</span><button class="btn" id="clear" title="移除全部">×</button><button class="btn" id="close" title="收起">–</button></div>
    <div id="chips"></div>
    <div id="empty">拖文件到主岛即可暂存</div>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
